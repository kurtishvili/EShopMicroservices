name: CI - Catalog.API

on:
  push:
    paths:
      - src/Services/Catalog/**
  pull_request:
    paths:
      - src/Services/Catalog/**
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore src/Services/Catalog/Catalog.API/Catalog.API.csproj

    - name: Build
      run: dotnet build src/Services/Catalog/Catalog.API/Catalog.API.csproj --no-restore --configuration Release

    - name: Run tests
      run: dotnet test src/Services/Catalog/Catalog.API/Catalog.API.csproj --no-build --verbosity normal
    - name: Publish Catalog.API
      run: dotnet publish src/Services/Catalog/Catalog.API/Catalog.API.csproj --configuration Release --output ./publish

    - name: Upload published artifact
      uses: actions/upload-artifact@v3
      with:
        name: catalog-api
        path: ./publish
